# 后端不可达时的静态说明页。
# 把本文件中的指令放进宝塔站点 server { }。
# 将 /www/wwwroot/example.com 换成实际网站根（与 index.html 同级，页面文件名为 backend-unavailable.html）。
# baota-install.sh / baota-upgrade.sh 会按网站根自动写入同等配置：写前备份，nginx -t 通过才 reload，失败则还原。
#
# error_page 502 503 504 /backend-unavailable.html;
# location = /backend-unavailable.html {
#     root /www/wwwroot/example.com;
#     default_type text/html;
# }

error_page 502 503 504 /backend-unavailable.html;
location = /backend-unavailable.html {
    root /www/wwwroot/example.com;
    default_type text/html;
}
