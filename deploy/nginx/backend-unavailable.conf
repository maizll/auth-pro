# 后端不可达时的静态说明页。
# 把本文件中的指令放进宝塔站点 server { }。
# 将 /www/wwwroot/example.com 换成实际网站根（与 index.html 同级，页面文件名为 backend-unavailable.html）。
# baota-install.sh / baota-upgrade.sh 会按网站根自动写入同等配置：写前备份，nginx -t 通过才 reload，失败则还原。
#
# error_page 502 503 504 /backend-unavailable.html;
# location = /backend-unavailable.html {
#     root /www/wwwroot/example.com;
#     default_type text/html;
# }

error_page 502 503 504 /backend-unavailable.html;
location = /backend-unavailable.html {
    root /www/wwwroot/example.com;
    default_type text/html;
}

# 入口页不要缓存。把 19127 换成站点反代端口。
# 在线更新完成后浏览器必须重新获取 index.html。
location = /index.html {
    proxy_pass http://127.0.0.1:19127;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_hide_header Cache-Control;
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    add_header Pragma "no-cache" always;
    add_header Expires "0" always;
}
